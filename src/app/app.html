<div class="announcement">A little something special: free shipping on orders over $75 <span>✳</span></div>
<header class="site-header">
  <a class="wordmark" routerLink="/" aria-label="Sunday home">sunday<span>.</span></a>
  <nav class="main-nav" aria-label="Main navigation">
    <a routerLink="/shop" routerLinkActive="active">Shop all</a>
    <a routerLink="/home">Home</a>
    <a routerLink="/shop" [queryParams]="{category:'Accessories'}">Accessories</a>
  </nav>
  <div class="header-actions">
    <a class="account-link" routerLink="/register">Your account</a>
    <a class="cart-link" routerLink="/cart" aria-label="Shopping bag">Bag <span class="cart-count">{{ shop.count() }}</span></a>
  </div>
</header>
<main><router-outlet /></main>
<footer class="site-footer">
  <a class="wordmark" routerLink="/">sunday<span>.</span></a>
  <span>Thoughtful things for everyday living.</span>
  <span>© 2025 Sunday Supply Co.</span>
</footer>
